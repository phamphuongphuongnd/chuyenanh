name: pdf_layout
description: >-
  Pure Dart layout reconstruction for text lines extracted from PDF pages
  (paragraphs, headings, lists, tables) plus a minimal DOCX writer.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.0.0
  collection: ^1.19.0
  xml: ^7.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
