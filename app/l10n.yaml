# Sinh AppLocalizations từ lib/l10n/app_<locale>.arb (do tool/merge_arb.dart gộp, gitignore).
# Chạy: dart run tool/merge_arb.dart && flutter gen-l10n
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n
nullable-getter: false
