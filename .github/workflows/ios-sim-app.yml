name: ios-sim-app

# Dựng bản app cho iPhone simulator (Runner.app, nén .zip) để tải lên Appetize và xem iPhone ảo trong trình duyệt.
# Chạy tay hoặc khi đẩy tag ios-sim-app-*. Không chạy bộ test, không build IPA.
on:
  workflow_dispatch:
  push:
    tags: ['ios-sim-app-*']

permissions:
  contents: write

jobs:
  build:
    # ML Kit loại arm64 khi build simulator → cần runner Intel (xem ios-sim.yml).
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # device_info_plus 13.3 cần SDK iOS 26; Xcode 26.3 có sẵn trên image.
      - name: Chọn Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # lib/l10n/ bị gitignore; flutter pub get tự sinh gói l10n nên cần ARB gộp TRƯỚC.
      - run: dart tool/merge_arb.dart
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: bash tool/fetch_fonts.sh
      # Simulator chỉ hỗ trợ debug.
      # `flutter build ios --simulator` nhắm mọi kiến trúc (kể cả arm64 mà ML Kit loại) → "Pods_Runner not found".
      # Ép chỉ build x86_64 (runner Intel); flutter drive nhắm đúng simulator theo UDID nên không bị lỗi này.
      - name: Build bản simulator (chỉ x86_64)
        run: |
          set -o pipefail
          {
            echo 'ARCHS = x86_64'
            echo 'EXCLUDED_ARCHS = arm64'
            echo 'ONLY_ACTIVE_ARCH = NO'
          } > "$RUNNER_TEMP/sim.xcconfig"
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/sim.xcconfig"
          flutter build ios --simulator --debug -v 2>&1 | tee build.log
          grep -E "xcodebuild.*(destination|ARCHS)" build.log | head -3 || true
      # Log job chỉ xem được khi đăng nhập; annotation thì đọc được công khai qua API.
      - name: Đưa đoạn cuối log lỗi ra annotation
        if: failure()
        run: |
          grep -E "xcodebuild.*(destination|ARCHS)" build.log 2>/dev/null | head -3 | cut -c1-600 > build-cmd.log || true
          cat build-cmd.log build.log 2>/dev/null > build-all.log
          MSG=$(tail -n 70 build-all.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=flutter build ios (60 dòng cuối)::${MSG:-không có build.log}"
      - name: Nén Runner.app
        run: |
          cd build/ios/iphonesimulator
          zip -qry ../../../PDFOffice-simulator.zip Runner.app
      - name: Đăng lên Release ios-sim-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ios-sim-app >/dev/null 2>&1 || gh release create ios-sim-app --title "iOS simulator app" --notes "Runner.app cho iPhone simulator (zip). Tải lên appetize.io để xem iPhone ảo trong trình duyệt. Không cài được lên iPhone thật."
          gh release upload ios-sim-app PDFOffice-simulator.zip --clobber
