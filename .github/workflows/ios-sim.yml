name: ios-sim

# Chạy tay hoặc khi đẩy tag ios-sim-*: mỗi lần mất 15–30 phút macOS nên không chạy mỗi lần push.
on:
  workflow_dispatch:
  push:
    tags: ['ios-sim-*']

permissions:
  contents: read

jobs:
  simulator:
    # ML Kit (OCR) loại arm64 khi build simulator → runner Apple Silicon (macos-latest) link lỗi
    # "Framework 'Pods_Runner' not found". Runner Intel có simulator x86_64 nên build được.
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Image Intel mặc định Xcode 16.4 (SDK iOS 18); device_info_plus 13.3 cần SDK iOS 26
      # (`isiOSAppOnVision`). Xcode 26.3 có sẵn trên image, kèm Simulator iOS 26.2.
      - name: Chọn Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # lib/l10n/ bị gitignore; flutter pub get tự sinh gói l10n nên cần ARB gộp TRƯỚC.
      - run: dart tool/merge_arb.dart
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: bash tool/fetch_fonts.sh
      - name: Chọn và bật iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted([k for k in d if 'iOS' in k], reverse=True):
              ph=[x for x in d[rt] if x['name'].startswith('iPhone') and x['isAvailable']]
              if ph:
                  print(ph[-1]['udid']); break
          ")
          echo "Simulator: $UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Chạy integration_test và chụp ảnh
        run: |
          set -o pipefail
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d "$UDID" 2>&1 | tee drive.log
      # Log job chỉ xem được khi đăng nhập; annotation thì đọc được công khai qua API.
      - name: Đưa đoạn cuối log lỗi ra annotation
        if: failure()
        run: |
          MSG=$(tail -n 60 drive.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=flutter drive (60 dòng cuối)::${MSG:-không có drive.log}"
      - name: Đăng ảnh chụp và log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-screenshots
          path: |
            app/screenshots
            app/drive.log
          if-no-files-found: warn
